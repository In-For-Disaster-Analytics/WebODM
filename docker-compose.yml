# This configuration does not include a processing node
# Which makes for faster setup times
version: '2.1'
volumes:
  dbdata:
  appmedia:
services:
  db:
    image: opendronemap/webodm_db
    container_name: db
    expose:
      - "5432"
    volumes:
      - ${WO_DB_DIR}:/var/lib/postgresql/data:Z
    restart: unless-stopped
    oom_score_adj: -100
  webapp:
    image: opendronemap/webodm_webapp
    container_name: webapp
    entrypoint: /bin/bash -c "service cron start && chmod +x /webodm/*.sh && /bin/bash -c \"/webodm/wait-for-postgres.sh db /webodm/wait-for-it.sh -t 0 broker:6379 -- /webodm/scripts/entrypoint-tapis.sh /webodm/start.sh\""
    volumes:
      - ${WO_MEDIA_DIR}:/webodm/app/media:z
      - ./scripts:/webodm/scripts:z
    group_add:
      - ${WO_CORRAL_GROUP_ID}
    ports:
      - "${WO_PORT}:8000"
    depends_on:
      - db
      - broker
      - worker
    environment:
      - WO_CORRAL_GROUP_ID
      - WO_PORT
      - WO_HOST
      - WO_DEBUG
      - WO_BROKER
      - WO_DEV
      - WO_DEV_WATCH_PLUGINS
      - WO_SECRET_KEY
      - WO_RUN_AS_USER
      - WEB_CONCURRENCY
      - WO_SHARED_VOLUME_ROOT
      - WO_TAPIS_BASE_URL
      - WO_TAPIS_TENANT_ID
      - WO_TAPIS_CLIENT_ID
      - WO_TAPIS_CLIENT_KEY
      - WO_TAPIS_CLIENT_SECRET
      - WO_TAPIS_CALLBACK_URL
      - WO_CLUSTERODM_URL
      - WO_TAS_URL
      - WO_TAS_SERVICE_USERNAME
      - WO_TAS_SERVICE_PASSWORD
      - WO_TAS_RESOURCE_FILTER
      - WO_TAS_DEFAULT_ALLOCATION
      - WO_TAS_REQUIRED_ALLOCATIONS
      - WO_TAS_ALLOCATION_CACHE_SECONDS
      - WO_DSO_AGENT_URL
      - WO_URL
      # Prevent numpy/GDAL from each spawning their own thread pool per
      # gunicorn worker; under concurrent raster requests this oversubscribes
      # CPU cores and causes severe slowdowns.
      # See ../docs/incidents/2026-07-20-public-map-cpu-thread-oversubscription.md
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - GDAL_NUM_THREADS=1
    restart: unless-stopped
    oom_score_adj: 0
  broker:
    image: redis:7.0.10
    container_name: broker
    restart: unless-stopped
    oom_score_adj: -500
    command: redis-server --save "" --stop-writes-on-bgsave-error no
  worker:
    image: opendronemap/webodm_webapp
    container_name: worker
    entrypoint: /bin/bash -c "/webodm/wait-for-postgres.sh db /webodm/wait-for-it.sh -t 0 broker:6379 -- /webodm/scripts/entrypoint-tapis.sh /webodm/wait-for-it.sh -t 0 webapp:8000 -- /webodm/worker.sh start"
    volumes:
      - ${WO_MEDIA_DIR}:/webodm/app/media:z
      - ./scripts:/webodm/scripts:z
    group_add:
      - ${WO_CORRAL_GROUP_ID}
    depends_on:
      - db
      - broker
    environment:
      - WO_BROKER
      - WO_DEBUG
      - WO_SECRET_KEY
      - WO_RUN_AS_USER
      - WEB_CONCURRENCY
      - WO_SHARED_VOLUME_ROOT
      - WO_TAPIS_BASE_URL
      - WO_TAPIS_TENANT_ID
      - WO_TAPIS_CLIENT_ID
      - WO_TAPIS_CLIENT_KEY
      - WO_TAPIS_CLIENT_SECRET
      - WO_TAPIS_CALLBACK_URL
      - WO_CLUSTERODM_URL
      - WO_TAS_URL
      - WO_TAS_SERVICE_USERNAME
      - WO_TAS_SERVICE_PASSWORD
      - WO_TAS_RESOURCE_FILTER
      - WO_TAS_DEFAULT_ALLOCATION
      - WO_TAS_REQUIRED_ALLOCATIONS
      - WO_TAS_ALLOCATION_CACHE_SECONDS
      - WO_DSO_AGENT_URL
      - WO_URL
      # Prevent numpy/GDAL from each spawning their own thread pool per
      # worker process; under concurrent raster tasks this oversubscribes
      # CPU cores and causes severe slowdowns.
      # See ../docs/incidents/2026-07-20-public-map-cpu-thread-oversubscription.md
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - GDAL_NUM_THREADS=1
    restart: unless-stopped
    oom_score_adj: 250
