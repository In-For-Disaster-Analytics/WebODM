{% extends "app/logged_in_base.html" %}
{% load i18n %}

{% block content %}
  <div class="alert alert-info">
    {% trans "Redirecting to ClusterODM…" %}
  </div>

  <noscript>
    <div class="alert alert-warning">
      {% trans "JavaScript is required to continue. Use the link below if you are not redirected." %}
    </div>
    <p>
      <a href="{{ clusterodm_url }}/admin/#token={{ tapis_jwt|urlencode }}">{{ clusterodm_url }}</a>
    </p>
  </noscript>

  <script type="text/javascript">
    (function () {
      var base = "{{ clusterodm_url|escapejs }}";
      var token = "{{ tapis_jwt|escapejs }}";
      if (!base || !token) {
        window.location.href = "/dashboard/";
        return;
      }
      var url = base.replace(/\/+$/, "") + "/admin/#token=" + encodeURIComponent(token);
      window.location.replace(url);
    })();
  </script>
{% endblock %}
